# Corre el buscador en GitHub y publica el dashboard en GitHub Pages.
# El estado (data/avisos.json) vive en la rama "datos", reescrita en cada pasada (no crece el repo).
name: Buscar deptos

on:
  schedule:
    # Hora de Chile (UTC-3 en verano, UTC-4 en invierno): ~7, 9, 11, 13, 15, 17, 19 y 21 h
    - cron: "7 10-22/2 * * *"
    - cron: "7 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: buscador
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: America/Santiago
      SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      CORREO_DESTINO: ${{ secrets.CORREO_DESTINO }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Recuperar datos de la pasada anterior
        run: |
          mkdir -p data
          if git fetch --depth=1 origin datos; then git show FETCH_HEAD:avisos.json > data/avisos.json; fi
          echo "DASHBOARD_URL=https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"

      - name: Buscar
        run: |
          python buscador.py
          # Diagnostico: que responde el portal a esta IP
          python - <<'EOF'
          import requests, re
          from buscador import HEADERS
          r = requests.get("https://www.portalinmobiliario.com/arriendo/departamento/las-condes-metropolitana", headers=HEADERS, timeout=30)
          t = re.search(r"<title[^>]*>(.*?)</title>", r.text, re.S)
          print("DIAG", r.status_code, r.url, len(r.text), t.group(1).strip()[:100] if t else None)
          EOF

      - name: Guardar datos
        if: always()
        run: |
          [ -f data/avisos.json ] || exit 0
          d=$(mktemp -d)
          cp data/avisos.json "$d/"
          cd "$d"
          git init -q -b datos
          git add avisos.json
          git -c user.name="buscador" -c user.email="buscador@users.noreply.github.com" commit -qm "datos $(date '+%F %T')"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos

      - name: Preparar sitio
        run: mkdir -p _site && cp dashboard.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
